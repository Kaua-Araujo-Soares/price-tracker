<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tracker — New Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-graph-up-arrow me-2"></i>Price Tracker
        </a>
        <div class="navbar-nav ms-auto align-items-center gap-2">
            <a class="nav-link" th:href="@{/products}"><i class="bi bi-box me-1"></i>Products</a>
            <a class="nav-link" th:href="@{/alerts}"><i class="bi bi-bell me-1"></i>Alerts</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger btn-sm ms-2">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="page-header mb-4">
        <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm mb-3">
            <i class="bi bi-arrow-left me-1"></i>Back
        </a>
        <h1 class="page-title">New Product</h1>
        <p class="page-subtitle">Add a product to start tracking its price</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="app-card">
                <div class="app-card-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/products/new}" method="post" th:object="${dto}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Product name</label>
                            <input type="text" id="name" th:field="*{name}"
                                   class="form-control" placeholder="e.g. Samsung Laptop" required>
                        </div>
                        <div class="mb-3">
                            <label for="url" class="form-label">Product URL</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                <input type="url" id="url" th:field="*{url}"
                                       class="form-control" placeholder="https://..." required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="provider" class="form-label">Store / Provider</label>
                            <select id="provider" th:field="*{provider}" class="form-select" required>
                                <option value="">Select...</option>
                                <option th:each="p : ${providers}" th:value="${p}" th:text="${p}"></option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-lg me-2"></i>Add product
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
