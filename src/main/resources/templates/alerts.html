<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tracker — Alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-graph-up-arrow me-2"></i>Price Tracker
        </a>
        <div class="navbar-nav ms-auto align-items-center gap-2">
            <a class="nav-link" th:href="@{/products}"><i class="bi bi-box me-1"></i>Produtos</a>
            <a class="nav-link active" th:href="@{/alerts}"><i class="bi bi-bell me-1"></i>Alertas</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger btn-sm ms-2">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="page-header mb-4">
        <h1 class="page-title">Alertas de Preço</h1>
        <p class="page-subtitle">Gerencie todos os seus alertas de preço</p>
    </div>

    <!-- Filtro por status -->
    <div class="mb-4 d-flex gap-2 flex-wrap">
        <a th:href="@{/alerts}" th:classappend="${selectedStatus == null} ? ' active'" class="btn btn-filter">
            Todos
        </a>
        <a th:each="s : ${statuses}"
           th:href="@{/alerts(status=${s})}"
           th:classappend="${selectedStatus == s.name()} ? ' active'"
           th:text="${s}"
           class="btn btn-filter">Status</a>
    </div>

    <div th:if="${#lists.isEmpty(alerts)}" class="empty-state-full">
        <i class="bi bi-bell-slash fs-1 mb-3 text-muted"></i>
        <h5>Nenhum alerta encontrado</h5>
        <p class="text-muted">Crie alertas acessando o detalhe de um produto.</p>
    </div>

    <div class="app-card" th:unless="${#lists.isEmpty(alerts)}">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço alvo</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Criado em</th>
                        <th>Disparado em</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="alert : ${alerts}">
                        <td>
                            <a th:href="@{/products/{id}(id=${alert.productId})}"
                               th:text="${alert.productName}" class="text-decoration-none text-light fw-semibold">
                            </a>
                        </td>
                        <td class="fw-semibold">
                            R$ <span th:text="${#numbers.formatDecimal(alert.targetPrice, 1, 2)}">0,00</span>
                        </td>
                        <td class="text-muted small" th:text="${alert.emailToNotify}">email</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${alert.status.name() == 'ACTIVE'} ? 'badge-active' : (${alert.status.name() == 'TRIGGERED'} ? 'badge-triggered' : 'badge-disabled')"
                                  th:text="${alert.status}">
                            </span>
                        </td>
                        <td class="text-muted small" th:text="${#temporals.format(alert.createdAt, 'dd/MM/yyyy')}">-</td>
                        <td class="text-muted small"
                            th:text="${alert.triggeredAt != null ? #temporals.format(alert.triggeredAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                        <td>
                            <form th:if="${alert.status.name() == 'ACTIVE'}"
                                  th:action="@{/alerts/{id}/disable(id=${alert.id})}" method="post">
                                <button class="btn btn-outline-secondary btn-xs">Desativar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
