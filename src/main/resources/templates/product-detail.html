<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tracker — Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-graph-up-arrow me-2"></i>Price Tracker
        </a>
        <div class="navbar-nav ms-auto align-items-center gap-2">
            <a class="nav-link" th:href="@{/products}"><i class="bi bi-box me-1"></i>Products</a>
            <a class="nav-link" th:href="@{/alerts}"><i class="bi bi-bell me-1"></i>Alerts</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger btn-sm ms-2">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i>Back to products
    </a>

    <!-- Product info -->
    <div class="app-card mb-4">
        <div class="app-card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h1 class="page-title mb-1" th:text="${product.name}">Name</h1>
                    <span class="provider-badge me-2" th:text="${product.provider}">ML</span>
                    <a th:href="${product.url}" target="_blank" class="text-muted small">
                        <i class="bi bi-box-arrow-up-right me-1"></i>View in store
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Price history chart -->
        <div class="col-lg-8">
            <div class="app-card">
                <div class="app-card-header">
                    <h5><i class="bi bi-bar-chart-line me-2"></i>Price History</h5>
                </div>
                <div class="app-card-body">
                    <div th:if="${#lists.isEmpty(prices)}" class="empty-state">
                        <i class="bi bi-clock-history"></i>
                        <p>No prices recorded yet. The scheduler will fetch them automatically.</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(prices)}">
                        <canvas id="priceChart" height="100"></canvas>
                    </div>
                </div>
            </div>

            <!-- Price records table -->
            <div class="app-card mt-3" th:unless="${#lists.isEmpty(prices)}">
                <div class="app-card-header">
                    <h6 class="mb-0">Price records</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="price : ${prices}">
                                <td th:text="${#temporals.format(price.recordedAt, 'MM/dd/yyyy HH:mm')}">01/01/2024</td>
                                <td class="fw-semibold">
                                    $<span th:text="${#numbers.formatDecimal(price.price, 1, 2)}">0.00</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div class="col-lg-4">
            <div class="app-card mb-3">
                <div class="app-card-header">
                    <h5><i class="bi bi-bell me-2"></i>Price Alerts</h5>
                </div>
                <div class="app-card-body">
                    <div th:if="${#lists.isEmpty(alerts)}" class="empty-state">
                        <i class="bi bi-bell-slash"></i>
                        <p>No alerts created.</p>
                    </div>
                    <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(alerts)}">
                        <li class="list-group-item list-group-item-dark" th:each="alert : ${alerts}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="small text-muted">Target</div>
                                    <div class="fw-semibold">
                                        $<span th:text="${#numbers.formatDecimal(alert.targetPrice, 1, 2)}">0.00</span>
                                    </div>
                                    <div class="small text-muted" th:text="${alert.emailToNotify}">email</div>
                                </div>
                                <div class="d-flex flex-column align-items-end gap-1">
                                    <span class="badge"
                                          th:classappend="${alert.status.name() == 'ACTIVE'} ? 'badge-active' : (${alert.status.name() == 'TRIGGERED'} ? 'badge-triggered' : 'badge-disabled')"
                                          th:text="${alert.status}">ACTIVE</span>
                                    <form th:if="${alert.status.name() == 'ACTIVE'}"
                                          th:action="@{/alerts/{id}/disable(id=${alert.id})}" method="post">
                                        <button class="btn btn-outline-secondary btn-xs">Disable</button>
                                    </form>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- New alert -->
            <div class="app-card">
                <div class="app-card-header">
                    <h6><i class="bi bi-plus-circle me-2"></i>New alert</h6>
                </div>
                <div class="app-card-body">
                    <form th:action="@{/alerts/products/{id}/new(id=${product.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label small">Target price ($)</label>
                            <input type="number" name="targetPrice" class="form-control form-control-sm"
                                   step="0.01" min="0" placeholder="e.g. 1499.90" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Notification email</label>
                            <input type="email" name="emailToNotify" class="form-control form-control-sm"
                                   placeholder="notify@email.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-bell-fill me-1"></i>Create alert
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/main.js}"></script>

<!-- Chart data passed to JS -->
<script th:if="${not #lists.isEmpty(prices)}">
    const priceData = {
        labels: [/*[[${prices.![#temporals.format(recordedAt, 'MM/dd HH:mm')]}]]*/],
        values: [/*[[${prices.![price]}]]*/]
    };
    renderPriceChart(priceData);
</script>
</body>
</html>
